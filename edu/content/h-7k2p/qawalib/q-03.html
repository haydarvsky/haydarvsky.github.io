<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التبويبات — قالب جاهز</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root { --emerald-deep:#0F4C3A; --emerald:#1a6b54; --amber:#D97706; --amber-soft:#F59E0B; --bg-cream:#FAF6EF; --bg-paper:#FFFFFF; --ink:#1F2937; --ink-soft:#6B7280; --line:#E5E0D5; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Tajawal', sans-serif; background: var(--bg-cream); color: var(--ink); min-height: 100vh; padding: 24px 16px; line-height: 1.6; }
.page { max-width: 1100px; margin: 0 auto; }
.teacher-panel { background: linear-gradient(135deg, var(--emerald-deep), var(--emerald)); color: var(--bg-cream); border-radius: 18px; padding: 28px 32px; margin-bottom: 32px; box-shadow: 0 12px 32px rgba(15, 76, 58, 0.18); position: relative; overflow: hidden; }
.teacher-panel::before { content: ''; position: absolute; top: 0; right: 0; width: 6px; height: 100%; background: var(--amber); }
.tp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 12px; }
.tp-title { font-family: 'Reem Kufi', sans-serif; font-size: 1.25rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.tp-toggle { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25); color: var(--bg-cream); padding: 8px 16px; border-radius: 999px; cursor: pointer; font-family: 'Tajawal', sans-serif; font-size: 0.9rem; transition: all 0.2s; }
.tp-toggle:hover { background: rgba(255,255,255,0.2); }
.tp-instructions { background: rgba(255,255,255,0.08); border-radius: 10px; padding: 14px 18px; margin-bottom: 20px; font-size: 0.95rem; border-right: 3px solid var(--amber-soft); }
.tp-instructions strong { color: var(--amber-soft); }
.tp-grid { display: grid; gap: 16px; }
.tp-field { display: grid; gap: 6px; }
.tp-label { font-family: 'Reem Kufi', sans-serif; font-weight: 500; font-size: 0.9rem; color: var(--amber-soft); }
.tp-input, .tp-textarea { width: 100%; background: rgba(255,255,255,0.95); color: var(--ink); border: 1px solid rgba(0,0,0,0.05); border-radius: 10px; padding: 12px 14px; font-family: 'Tajawal', sans-serif; font-size: 1rem; resize: vertical; transition: all 0.2s; }
.tp-input:focus, .tp-textarea:focus { outline: none; box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.4); }
.tp-textarea { min-height: 100px; }
.tp-item-input { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.tp-item-input .tp-label { font-size: 0.82rem; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.tp-item-num { background: var(--amber); color: white; width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; }
.tp-actions { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
.tp-btn { background: var(--amber); color: white; border: none; padding: 12px 22px; border-radius: 10px; cursor: pointer; font-family: 'Reem Kufi', sans-serif; font-weight: 500; font-size: 0.95rem; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
.tp-btn:hover { background: #B45309; transform: translateY(-2px); }
.tp-btn-secondary { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25); }
.tp-btn-secondary:hover { background: rgba(255,255,255,0.18); }
.tp-collapsed .tp-content { display: none; }
.preview-wrap { background: var(--bg-paper); border-radius: 18px; padding: 40px 32px; box-shadow: 0 4px 16px rgba(0,0,0,0.04); }
.preview-header { text-align: center; margin-bottom: 36px; }
.preview-title { font-family: 'Reem Kufi', sans-serif; font-size: 2rem; font-weight: 700; color: var(--emerald-deep); margin-bottom: 8px; }
.preview-subtitle { color: var(--ink-soft); font-size: 1.05rem; }
.tabs { max-width: 800px; margin: 0 auto; }
.tabs-header { display: flex; gap: 8px; border-bottom: 2px solid var(--line); margin-bottom: 24px; flex-wrap: wrap; }
.tab-btn { background: none; border: none; padding: 14px 22px; cursor: pointer; font-family: 'Reem Kufi', sans-serif; font-weight: 500; font-size: 1rem; color: var(--ink-soft); border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.3s; }
.tab-btn:hover { color: var(--emerald); }
.tab-btn.active { color: var(--emerald-deep); border-bottom-color: var(--amber); }
.tab-content { display: none; padding: 24px; background: var(--bg-cream); border-radius: 12px; line-height: 1.8; }
.tab-content.active { display: block; animation: fadeIn 0.4s; }
.tab-content h4 { font-family: 'Reem Kufi', sans-serif; color: var(--emerald-deep); margin-bottom: 12px; font-size: 1.2rem; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.signature { text-align: center; margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 0.85rem; font-family: 'Reem Kufi', sans-serif; }
.signature-name { color: var(--emerald-deep); font-weight: 600; }
@media print { .teacher-panel { display: none; } body { background: white; padding: 0; } }
@media (max-width: 600px) { .tp-header { flex-direction: column; align-items: flex-start; } .preview-title { font-size: 1.5rem; } }
</style>

<meta name="hv-nav" content="mini">
<meta name="hv-title" content="التبويبات">
<meta name="hv-parent" content="/edu/content/h-7k2p/qawalib/index.html">
<meta name="hv-parent-title" content="كتالوجُ القوالب">
<meta name="robots" content="noindex,nofollow">
<script src="https://haydarvsky.github.io/nav/nav.js" defer></script>
</head>
<body>
<div class="page">
  <div class="teacher-panel" id="teacher-panel">
    <div class="tp-header">
      <div class="tp-title"><span>🎛️</span><span>لوحةُ تحكُّمِ المعلِّمِ — التبويبات</span></div>
      <button class="tp-toggle" onclick="toggleTeacherPanel()">إخفاءُ اللوحة</button>
    </div>
    <div class="tp-content">
      <div class="tp-instructions">
        <strong>كيف تستعمل هذا القالب؟</strong>
        مثاليٌّ لمقارنةِ شيئَين أو ثلاثةٍ في صفحةٍ واحدة (مثلَ مقارنةِ نوعَين من الانقسام، أو ثلاثِ شخصيَّاتٍ تاريخيَّة). يَنقرُ الطالبُ على التبويبِ فيَنتقلُ إلى محتواه.
      </div>
      <div class="tp-grid">
        <div class="tp-field">
          <label class="tp-label">عنوانُ الموقع</label>
          <input type="text" class="tp-input" id="ctrl-title" value="مقارنةُ الانقسامِ الخلوي" oninput="updatePreview()">
        </div>
        <div class="tp-field">
          <label class="tp-label">الوصفُ التحتي</label>
          <input type="text" class="tp-input" id="ctrl-subtitle" value="انقر على أيِّ تبويبٍ لتقرأَ محتواه" oninput="updatePreview()">
        </div>
        <div>
          <label class="tp-label" style="display:block; margin-bottom:10px;">التبويبات (ثلاثةٌ كحدٍّ أقصى)</label>

          <div class="tp-item-input">
            <label class="tp-label"><span class="tp-item-num">١</span> التبويبُ الأوَّل</label>
            <input type="text" class="tp-input" id="t-1-title" placeholder="عنوان التبويب" value="الانقسامُ المتساوي" oninput="updatePreview()" style="margin-bottom:6px;">
            <input type="text" class="tp-input" id="t-1-heading" placeholder="عنوان داخلي (اختياري)" value="Mitosis — للنموِّ والإصلاح" oninput="updatePreview()" style="margin-bottom:6px;">
            <textarea class="tp-textarea" id="t-1-content" placeholder="المحتوى" oninput="updatePreview()">يُنتجُ خليَّتينِ بالعددِ نفسِه من الكروموسومات (٢ن). الهدف: النموُّ والإصلاحُ والتكاثرُ اللاجنسي. يحدثُ في الخلايا الجسدية.</textarea>
          </div>

          <div class="tp-item-input">
            <label class="tp-label"><span class="tp-item-num">٢</span> التبويبُ الثاني</label>
            <input type="text" class="tp-input" id="t-2-title" placeholder="عنوان التبويب" value="الانقسامُ المنصِّف" oninput="updatePreview()" style="margin-bottom:6px;">
            <input type="text" class="tp-input" id="t-2-heading" placeholder="عنوان داخلي" value="Meiosis — للتكاثرِ الجنسي" oninput="updatePreview()" style="margin-bottom:6px;">
            <textarea class="tp-textarea" id="t-2-content" placeholder="المحتوى" oninput="updatePreview()">يُنتجُ أربعَ خلايا بنصفِ عددِ الكروموسومات (ن). الهدف: التكاثرُ الجنسي. لا يحدثُ إلَّا في الخلايا التناسلية.</textarea>
          </div>

          <div class="tp-item-input">
            <label class="tp-label"><span class="tp-item-num">٣</span> التبويبُ الثالث <span style="font-weight:400; opacity:0.6;">(اختياري)</span></label>
            <input type="text" class="tp-input" id="t-3-title" placeholder="عنوان التبويب" value="الفرقُ الجوهري" oninput="updatePreview()" style="margin-bottom:6px;">
            <input type="text" class="tp-input" id="t-3-heading" placeholder="عنوان داخلي" value="بينَ المتساوي والمنصِّف" oninput="updatePreview()" style="margin-bottom:6px;">
            <textarea class="tp-textarea" id="t-3-content" placeholder="المحتوى" oninput="updatePreview()">المتساوي يُنتجُ نُسخًا مطابقة، أمَّا المنصِّفُ فيُنتجُ نصفَ العدد ويُحدثُ تنوُّعًا وراثيًّا. وهذا التنوُّعُ هو سرُّ اختلافِ الإخوةِ بعضِهم عن بعض.</textarea>
          </div>
        </div>

        <div class="tp-field">
          <label class="tp-label">اسمُ المعلِّمِ (اختياري)</label>
          <input type="text" class="tp-input" id="ctrl-teacher" placeholder="أ. فلان الفلاني" oninput="updatePreview()">
        </div>
      </div>
      <div class="tp-actions">
        <button class="tp-btn" onclick="downloadFinal()">💾 حفظُ نسخةٍ نهائيَّة</button>
        <button class="tp-btn tp-btn-secondary" onclick="window.print()">🖨️ طباعة</button>
        <button class="tp-btn tp-btn-secondary" onclick="resetForm()">↻ إعادةُ التعيين</button>
      </div>
    </div>
  </div>

  <div class="preview-wrap">
    <div class="preview-header">
      <h1 class="preview-title" id="preview-title">مقارنة</h1>
      <p class="preview-subtitle" id="preview-subtitle">انقر على أيِّ تبويب</p>
    </div>
    <div class="tabs">
      <div class="tabs-header" id="tabs-header"></div>
      <div id="tabs-content"></div>
    </div>
    <div class="signature" id="signature" style="display:none;">من إعدادِ <span class="signature-name" id="signature-name"></span></div>
  </div>
</div>

<script>
function updatePreview() {
  document.getElementById('preview-title').textContent = document.getElementById('ctrl-title').value || 'مقارنة';
  document.getElementById('preview-subtitle').textContent = document.getElementById('ctrl-subtitle').value || '';
  document.title = (document.getElementById('ctrl-title').value || 'مقارنة') + ' — موقع تعليمي';

  const headerC = document.getElementById('tabs-header');
  const contentC = document.getElementById('tabs-content');
  headerC.innerHTML = ''; contentC.innerHTML = '';

  let firstSet = false;
  for (let i = 1; i <= 3; i++) {
    const title = document.getElementById('t-' + i + '-title').value;
    const heading = document.getElementById('t-' + i + '-heading').value;
    const content = document.getElementById('t-' + i + '-content').value;
    if (!title && !content) continue;

    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (!firstSet ? ' active' : '');
    btn.textContent = title || 'تبويب';
    btn.onclick = () => switchTab(i);
    btn.dataset.idx = i;
    headerC.appendChild(btn);

    const div = document.createElement('div');
    div.className = 'tab-content' + (!firstSet ? ' active' : '');
    div.id = 'tc-' + i;
    div.innerHTML = (heading ? `<h4>${heading}</h4>` : '') + `<p>${content || ''}</p>`;
    contentC.appendChild(div);

    firstSet = true;
  }

  const teacher = document.getElementById('ctrl-teacher').value.trim();
  const sig = document.getElementById('signature');
  if (teacher) { sig.style.display = 'block'; document.getElementById('signature-name').textContent = teacher; }
  else { sig.style.display = 'none'; }
}

function switchTab(idx) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelector('.tab-btn[data-idx="' + idx + '"]').classList.add('active');
  document.getElementById('tc-' + idx).classList.add('active');
}

function toggleTeacherPanel() {
  const panel = document.getElementById('teacher-panel');
  const btn = panel.querySelector('.tp-toggle');
  panel.classList.toggle('tp-collapsed');
  btn.textContent = panel.classList.contains('tp-collapsed') ? 'إظهارُ اللوحة' : 'إخفاءُ اللوحة';
}

function escapeHTML(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function downloadFinal() {
  const title = document.getElementById('ctrl-title').value || 'مقارنة';
  const subtitle = document.getElementById('ctrl-subtitle').value || '';
  const teacher = document.getElementById('ctrl-teacher').value.trim();

  let headersHTML = '', contentsHTML = '';
  let firstSet = false;
  for (let i = 1; i <= 3; i++) {
    const t = document.getElementById('t-' + i + '-title').value;
    const h = document.getElementById('t-' + i + '-heading').value;
    const c = document.getElementById('t-' + i + '-content').value;
    if (!t && !c) continue;
    headersHTML += `<button class="tab-btn${!firstSet?' active':''}" onclick="switchTab(${i})" data-idx="${i}">${escapeHTML(t)}</button>`;
    contentsHTML += `<div class="tab-content${!firstSet?' active':''}" id="tc-${i}">${h?'<h4>'+escapeHTML(h)+'</h4>':''}<p>${escapeHTML(c)}</p></div>`;
    firstSet = true;
  }

  const sigHTML = teacher ? `<div class="signature">من إعدادِ <span class="signature-name">${escapeHTML(teacher)}</span></div>` : '';

  const finalHTML = `<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${escapeHTML(title)}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>:root{--emerald-deep:#0F4C3A;--emerald:#1a6b54;--amber:#D97706;--bg-cream:#FAF6EF;--bg-paper:#FFFFFF;--ink:#1F2937;--ink-soft:#6B7280;--line:#E5E0D5}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Tajawal',sans-serif;background:var(--bg-cream);color:var(--ink);min-height:100vh;padding:40px 16px;line-height:1.6}.page{max-width:1100px;margin:0 auto}.preview-wrap{background:var(--bg-paper);border-radius:18px;padding:40px 32px;box-shadow:0 4px 16px rgba(0,0,0,0.04)}.preview-header{text-align:center;margin-bottom:36px}.preview-title{font-family:'Reem Kufi',sans-serif;font-size:2rem;font-weight:700;color:var(--emerald-deep);margin-bottom:8px}.preview-subtitle{color:var(--ink-soft);font-size:1.05rem}.tabs{max-width:800px;margin:0 auto}.tabs-header{display:flex;gap:8px;border-bottom:2px solid var(--line);margin-bottom:24px;flex-wrap:wrap}.tab-btn{background:none;border:none;padding:14px 22px;cursor:pointer;font-family:'Reem Kufi',sans-serif;font-weight:500;font-size:1rem;color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all 0.3s}.tab-btn:hover{color:var(--emerald)}.tab-btn.active{color:var(--emerald-deep);border-bottom-color:var(--amber)}.tab-content{display:none;padding:24px;background:var(--bg-cream);border-radius:12px;line-height:1.8}.tab-content.active{display:block;animation:fadeIn 0.4s}.tab-content h4{font-family:'Reem Kufi',sans-serif;color:var(--emerald-deep);margin-bottom:12px;font-size:1.2rem}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.signature{text-align:center;margin-top:32px;padding-top:20px;border-top:1px solid var(--line);color:var(--ink-soft);font-size:0.85rem;font-family:'Reem Kufi',sans-serif}.signature-name{color:var(--emerald-deep);font-weight:600}@media (max-width:600px){.preview-title{font-size:1.5rem}}</style></head>
<body><div class="page"><div class="preview-wrap">
<div class="preview-header"><h1 class="preview-title">${escapeHTML(title)}</h1><p class="preview-subtitle">${escapeHTML(subtitle)}</p></div>
<div class="tabs"><div class="tabs-header">${headersHTML}</div><div>${contentsHTML}</div></div>${sigHTML}
</div></div>
<script>function switchTab(idx){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));document.querySelector('.tab-btn[data-idx="'+idx+'"]').classList.add('active');document.getElementById('tc-'+idx).classList.add('active');}<\/script>
</body></html>`;

  const blob = new Blob([finalHTML], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (title || 'تبويبات').replace(/[^\u0600-\u06FFa-zA-Z0-9-_ ]/g, '') + '.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function resetForm() { if (confirm('هل تريدُ إعادةَ القيمِ إلى مثالِ البداية؟')) location.reload(); }

updatePreview();
</script>
</body></html>
