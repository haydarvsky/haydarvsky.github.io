<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>العرضُ التقديمي — مدرستي</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#062219">
<meta name="hv-nav" content="off">
<link rel="icon" href="/img/logo-cream.svg">
<script src="js/fb.js?v=11"></script>
<script src="js/bio.js?v=11"></script>
<style>
:root{
  --green:#0F4C3A; --deep:#0A3428; --ink:#062219;
  --gold:#D9A441; --amber:#E0B057; --cream:#F1E9D6; --dim:rgba(241,233,214,.62);
  --e:cubic-bezier(.22,.61,.36,1);
  --pad:clamp(24px,4.4vw,74px);
  --h1:clamp(34px,6.2vw,86px);
  --h2:clamp(26px,4.1vw,58px);
  --h3:clamp(20px,2.5vw,34px);
  --tx:clamp(17px,1.85vw,29px);
  --sm:clamp(13px,1.15vw,18px);
}
@font-face{font-family:'Sakkal Saad';src:url('/fonts/sakkal-400.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Sakkal Saad';src:url('/fonts/sakkal-700.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Sakkal Saad Poster';src:url('/fonts/poster-700.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Sakkal Saad Poster';src:url('/fonts/poster-900.woff2') format('woff2');font-weight:900;font-display:swap}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--cream);font-family:'Sakkal Saad',system-ui,sans-serif;overflow:hidden;
  -webkit-font-smoothing:antialiased;font-size:var(--tx);line-height:1.75}
h1,h2,h3{font-family:'Sakkal Saad Poster','Sakkal Saad',serif;margin:0;font-weight:700;line-height:1.22}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
[hidden]{display:none!important}

/* ===== الخلفية ===== */
.bg{position:fixed;inset:0;z-index:0;background:
  radial-gradient(120% 90% at 88% -10%,rgba(217,164,65,.20),transparent 58%),
  radial-gradient(90% 80% at 6% 108%,rgba(15,76,58,.85),transparent 62%),
  linear-gradient(160deg,#08281E 0%,#062219 55%,#04160F 100%)}
.bg::after{content:'';position:absolute;inset:0;opacity:.055;
  background-image:radial-gradient(circle at 1px 1px,var(--cream) 1px,transparent 0);background-size:26px 26px}

/* ===== المسرح ===== */
.stage{position:relative;z-index:1;height:100svh;display:grid;grid-template-rows:auto 1fr auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px var(--pad) 0}
.top .id{display:flex;align-items:center;gap:11px;min-width:0}
.top .id img{height:clamp(24px,2.4vw,34px);width:auto;opacity:.9}
.top .id b{font-family:'Sakkal Saad Poster',serif;font-size:var(--sm);letter-spacing:.01em}
.top .id small{display:block;font-size:calc(var(--sm)*.85);color:var(--dim);margin-top:-3px}
.top .kick{font-size:var(--sm);color:var(--gold);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.slidewrap{position:relative;overflow:hidden}
.slide{position:absolute;inset:0;padding:clamp(10px,2vh,26px) var(--pad);display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,1.7vh,22px);
  opacity:0;visibility:hidden;transform:translateY(18px) scale(.985);transition:opacity .42s var(--e),transform .52s var(--e),visibility .42s}
.slide.on{opacity:1;visibility:visible;transform:none}
.slide.out{transform:translateY(-14px) scale(.99)}
.slide>*{max-width:1520px;width:100%;margin-inline:auto}

/* ===== الشريطُ السفلي ===== */
.bottom{display:flex;align-items:center;gap:14px;padding:0 var(--pad) 14px}
.bar{flex:1;height:3px;background:rgba(241,233,214,.14);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(to left,var(--gold),var(--amber));border-radius:3px;transition:width .45s var(--e)}
.count{font-size:var(--sm);color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.tools{display:flex;gap:6px}
.tools button{width:clamp(30px,2.6vw,38px);height:clamp(30px,2.6vw,38px);border-radius:50%;border:1px solid rgba(241,233,214,.2);display:grid;place-items:center;transition:all .18s var(--e)}
.tools button:hover{background:rgba(241,233,214,.12);border-color:var(--gold);color:var(--gold)}
.tools svg{width:52%;height:52%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ===== الغلاف ===== */
.cover{text-align:center;gap:0}
.cover .mark{width:clamp(52px,6vw,86px);margin:0 auto clamp(10px,2vh,22px);opacity:.95}
.cover .over{font-size:var(--h3);color:var(--gold);font-weight:700;letter-spacing:.02em}
.cover h1{font-size:var(--h1);color:#fff;margin:.12em 0 .18em;text-shadow:0 10px 40px rgba(0,0,0,.4)}
.cover .rule{width:clamp(90px,10vw,150px);height:3px;background:var(--gold);border-radius:3px;margin:0 auto clamp(12px,2.4vh,26px)}
.cover .meta{display:flex;justify-content:center;gap:clamp(14px,3vw,46px);flex-wrap:wrap;color:var(--dim);font-size:var(--h3)}
.cover .meta b{color:var(--cream);font-weight:700}

/* ===== العناوين ===== */
.head{display:flex;align-items:center;gap:14px;flex:0 0 auto}
.head .dot{width:clamp(9px,.85vw,13px);height:clamp(9px,.85vw,13px);border-radius:50%;background:var(--gold);flex:0 0 auto;box-shadow:0 0 0 6px rgba(217,164,65,.16)}
.head h2{font-size:var(--h2);color:#fff}
.head .ln{flex:1;height:1px;background:linear-gradient(to left,rgba(241,233,214,.3),transparent)}

/* ===== فاصلُ المشهد ===== */
.divider{text-align:center}
.divider .n{font-family:'Sakkal Saad Poster',serif;font-size:clamp(64px,13vw,190px);color:rgba(217,164,65,.16);line-height:.9}
.divider h2{font-size:var(--h1);color:#fff;margin-top:-.28em}
.divider p{color:var(--gold);font-size:var(--h3);margin:.35em 0 0}

/* ===== النواتج ===== */
.outs{display:grid;gap:clamp(7px,1.2vh,14px)}
.outs li{list-style:none;display:flex;align-items:flex-start;gap:clamp(11px,1.2vw,20px);
  background:linear-gradient(to left,rgba(241,233,214,.07),rgba(241,233,214,.02));border:1px solid rgba(241,233,214,.11);
  border-radius:16px;padding:clamp(8px,1.2vh,15px) clamp(13px,1.5vw,24px)}
.outs li .i{flex:0 0 auto;width:clamp(28px,2.6vw,40px);height:clamp(28px,2.6vw,40px);border-radius:12px;background:rgba(217,164,65,.16);color:var(--gold);
  display:grid;place-items:center;font-weight:700;font-family:'Sakkal Saad Poster',serif;font-size:calc(var(--tx)*.9)}
.outs li span{padding-top:.08em}

/* ===== الآيات ===== */
.verses{display:grid;gap:clamp(8px,1.5vh,20px);text-align:center}
.verses .v{font-size:clamp(19px,2.35vw,38px);line-height:2.05;color:#fff;font-weight:700;position:relative;
  padding:clamp(6px,1vh,14px) clamp(18px,3vw,54px);border-radius:18px;background:rgba(241,233,214,.045);border:1px solid rgba(241,233,214,.09)}
.verses .v em{font-style:normal;color:var(--gold);font-size:.62em;font-family:'Sakkal Saad Poster',serif;
  display:inline-grid;place-items:center;min-width:2.05em;height:2.05em;border-radius:50%;border:1.5px solid rgba(217,164,65,.5);margin-inline-start:.5em;vertical-align:.15em}
.verses .src{color:var(--dim);font-size:var(--sm)}

/* ===== السؤال ===== */
.q{font-size:var(--h3);color:var(--gold);font-weight:700;display:flex;gap:12px;align-items:flex-start}
.q .n{flex:0 0 auto;background:var(--gold);color:var(--ink);border-radius:10px;padding:0 .55em;font-family:'Sakkal Saad Poster',serif;font-size:.86em}
.quote{text-align:center;font-size:clamp(19px,2.3vw,36px);color:#fff;font-weight:700;line-height:1.95;
  background:rgba(217,164,65,.09);border:1px solid rgba(217,164,65,.24);border-radius:18px;padding:clamp(8px,1.4vh,18px) clamp(18px,3vw,50px)}
.quote::before{content:'﴿ ';color:var(--gold)}.quote::after{content:' ﴾';color:var(--gold)}
.verseline{text-align:center;color:#fff;font-size:clamp(18px,2.1vw,33px);line-height:1.9}
.verseline .sh{display:flex;justify-content:center;gap:clamp(22px,4vw,80px);flex-wrap:wrap}
.verseline .lbl{display:block;color:var(--dim);font-size:var(--sm);font-weight:400;margin-bottom:.2em}
.prompt{color:var(--cream);font-size:var(--tx)}

/* ===== الإجابات ===== */
.ans{display:grid;gap:clamp(7px,1.1vh,13px)}
.ans .a{display:flex;gap:clamp(10px,1.1vw,18px);align-items:flex-start;
  background:linear-gradient(to left,rgba(15,76,58,.62),rgba(15,76,58,.3));border:1px solid rgba(217,164,65,.3);
  border-radius:16px;padding:clamp(8px,1.2vh,15px) clamp(13px,1.6vw,26px);box-shadow:0 18px 40px -30px #000}
.ans .a .tick{flex:0 0 auto;width:clamp(22px,1.9vw,30px);height:clamp(22px,1.9vw,30px);border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;margin-top:.15em}
.ans .a .tick svg{width:60%;height:60%;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* ===== أكملْ ===== */
.fill{display:flex;flex-wrap:wrap;gap:clamp(8px,1.1vw,18px);justify-content:center;font-size:clamp(18px,2.1vw,33px)}
.fill .w{background:rgba(241,233,214,.07);border:1px solid rgba(241,233,214,.14);border-radius:14px;padding:.2em .9em;font-weight:700}
.fill .w.b{background:rgba(217,164,65,.14);border-color:rgba(217,164,65,.45);color:var(--gold)}
.fill .w.b.hide{color:transparent;background:rgba(241,233,214,.04);border-style:dashed;min-width:5.5em}

/* ===== الترتيب ===== */
.order{display:grid;gap:clamp(6px,1vh,12px)}
.order .o{display:flex;align-items:center;gap:clamp(11px,1.3vw,22px);background:rgba(241,233,214,.055);border:1px solid rgba(241,233,214,.12);
  border-radius:16px;padding:clamp(7px,1.05vh,14px) clamp(13px,1.6vw,24px);transition:all .3s var(--e)}
.order .o .num{flex:0 0 auto;width:clamp(30px,2.7vw,44px);height:clamp(30px,2.7vw,44px);border-radius:50%;display:none;place-items:center;
  font-family:'Sakkal Saad Poster',serif;font-weight:700;font-size:calc(var(--tx)*.95);
  border:1.5px solid var(--gold);background:var(--gold);color:var(--ink);transition:all .35s var(--e)}
.order .o.show .num{display:grid;transform:scale(1.06)}
.order .o.show.ok{border-color:rgba(64,180,110,.75)}
.order .o.show.ok .num{background:#2E9E62;border-color:#2E9E62;color:#fff}
.order .o.show.bad{border-color:rgba(224,80,62,.7)}
.order .o.show.bad .num{background:#C8412F;border-color:#C8412F;color:#fff}
.order .o.show{border-color:rgba(217,164,65,.45);background:linear-gradient(to left,rgba(15,76,58,.5),rgba(241,233,214,.04))}


/* ===== اختيارٌ من متعدّد ===== */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(7px,1.1vh,14px)}
.opts .o{display:flex;gap:12px;align-items:flex-start;background:rgba(241,233,214,.05);border:1px solid rgba(241,233,214,.12);
  border-radius:15px;padding:clamp(7px,1.05vh,14px) clamp(12px,1.5vw,22px);transition:all .3s var(--e)}
.opts .o .b{flex:0 0 auto;width:clamp(22px,1.8vw,28px);height:clamp(22px,1.8vw,28px);border-radius:9px;border:1.5px solid rgba(241,233,214,.3);margin-top:.15em}
.opts .o.in.right{background:linear-gradient(to left,rgba(15,76,58,.7),rgba(15,76,58,.35));border-color:var(--gold);box-shadow:0 18px 40px -30px #000}
.opts .o.in.right .b{background:var(--gold);border-color:var(--gold)}
.opts .o.dim{opacity:.42}
@media(max-width:900px){.opts{grid-template-columns:1fr}}

/* ===== جدول ===== */
table.t{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:calc(var(--tx)*.94)}
table.t th{background:rgba(217,164,65,.16);color:var(--gold);font-weight:700;padding:.4em .9em;text-align:start;font-size:calc(var(--tx)*.82)}
table.t th:first-child{border-radius:0 14px 14px 0}table.t th:last-child{border-radius:14px 0 0 14px}
table.t td{background:rgba(241,233,214,.05);padding:.42em .9em;vertical-align:top}
table.t td:first-child{border-radius:0 14px 14px 0}table.t td:last-child{border-radius:14px 0 0 14px}

/* ===== الخلاصة ===== */
.points{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:clamp(9px,1.4vw,20px)}
.points .p{background:linear-gradient(165deg,rgba(241,233,214,.09),rgba(241,233,214,.02));border:1px solid rgba(241,233,214,.13);
  border-radius:20px;padding:clamp(13px,1.8vh,26px) clamp(14px,1.6vw,26px);text-align:center}
.points .p .g{font-family:'Sakkal Saad Poster',serif;font-size:clamp(28px,3.4vw,52px);color:var(--gold);line-height:1}
.points .p b{display:block;font-size:calc(var(--tx)*1.02);margin:.35em 0 .1em;color:#fff}
.points .p span{color:var(--dim);font-size:calc(var(--tx)*.86);line-height:1.6;display:block}


/* ===== العصفُ الذهني ===== */
.bs{position:relative;height:min(66vh,700px);display:grid;place-items:center}
.bs .core{position:relative;z-index:2;width:min(34vw,330px,42vh);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;padding:clamp(18px,3vw,44px);
  background:radial-gradient(circle at 50% 35%,rgba(217,164,65,.28),rgba(217,164,65,.08) 60%,transparent 72%),rgba(15,76,58,.55);
  border:1.5px solid rgba(217,164,65,.55);box-shadow:0 0 0 clamp(10px,1.6vw,22px) rgba(217,164,65,.06),0 30px 80px -40px #000;
  font-family:'Sakkal Saad Poster',serif;font-size:clamp(18px,2.2vw,34px);color:#fff;line-height:1.35}
.bs .core small{display:block;font-family:'Sakkal Saad',sans-serif;font-weight:400;font-size:.5em;color:var(--gold);margin-bottom:.4em;letter-spacing:.03em}
.bs .bub{position:absolute;left:50%;top:50%;width:clamp(150px,17vw,250px);min-height:clamp(56px,7vh,84px);padding:clamp(6px,1vh,12px) clamp(12px,1.4vw,20px);
  border-radius:100px;display:grid;place-items:center;text-align:center;font-weight:700;font-size:calc(var(--tx)*.9);line-height:1.4;
  border:1.5px dashed rgba(241,233,214,.5);color:transparent;transform:translate(-50%,-50%) translate(var(--x),var(--y)) scale(.92);
  transition:all .5s var(--e)}
.bs .bub::before{content:'';display:none}
.bs .bub{opacity:0;pointer-events:none}
.bs .bub.has,.bs .bub.in{opacity:1;pointer-events:auto}
.bs .bub.has:not(.in){border-style:solid;border-color:rgba(241,233,214,.45);background:rgba(241,233,214,.07);color:#fff;transform:translate(-50%,-50%) translate(var(--x),var(--y)) scale(1)}
.bs .bub.in{color:#fff;border:1.5px solid var(--gold);background:linear-gradient(to left,rgba(15,76,58,.85),rgba(15,76,58,.45));transform:translate(-50%,-50%) translate(var(--x),var(--y)) scale(1);
  box-shadow:0 20px 50px -30px #000}
.bs .ray{position:absolute;left:50%;top:50%;height:1px;width:var(--len);transform-origin:0 50%;transform:rotate(var(--a));background:linear-gradient(to right,rgba(217,164,65,.55),transparent);z-index:1}
@media(max-width:760px){
  .bs{height:auto;display:block;padding-bottom:10px}
  .bs .core{width:min(72vw,260px);margin:0 auto 14px;font-size:clamp(17px,4.8vw,22px)}
  .bs .ray{display:none}
  .bs .bub{position:static;transform:none;width:100%;min-height:0;margin:8px 0;border-radius:16px;padding:10px 14px}
  .bs .bub.in{transform:none}
}

/* ===== المشهدُ المرسوم ===== */
.scene{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(18px,3vw,56px);align-items:center}
.scene .art{width:100%;max-height:min(56vh,560px)}
.scene .art svg{width:100%;height:100%;display:block}
.scene .txt h2{font-size:var(--h2);color:#fff;line-height:1.3}
.scene .txt p{color:var(--dim);font-size:calc(var(--tx)*1.02);margin:.6em 0 0}
.scene .txt .ask{margin-top:clamp(12px,2vh,22px);padding:clamp(9px,1.4vh,16px) clamp(14px,1.6vw,24px);border-radius:16px;background:rgba(217,164,65,.1);border:1px solid rgba(217,164,65,.3);color:var(--gold);font-weight:700;font-size:calc(var(--tx)*1.05)}
@media(max-width:900px){.scene{grid-template-columns:1fr}.scene .art{max-height:32vh}}
.art .g{stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.art .c{stroke:rgba(241,233,214,.75);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.art .f{fill:rgba(217,164,65,.14)}
.art .w{stroke:rgba(241,233,214,.35);fill:none;stroke-width:1.2;stroke-linecap:round}
.art .draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.6s var(--e) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.art .float{animation:float 4.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* ===== فكّر – زاوج – شارك ===== */
.tps{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,1.6vw,24px)}
.tps .s{position:relative;border-radius:22px;padding:clamp(16px,2.4vh,30px) clamp(14px,1.6vw,26px);background:linear-gradient(165deg,rgba(241,233,214,.09),rgba(241,233,214,.02));border:1px solid rgba(241,233,214,.14);text-align:center}
.tps .s .k{font-family:'Sakkal Saad Poster',serif;font-size:clamp(30px,4vw,62px);color:var(--gold);line-height:1}
.tps .s b{display:block;font-size:calc(var(--tx)*1.15);color:#fff;margin:.25em 0 .15em}
.tps .s span{display:block;color:var(--dim);font-size:calc(var(--tx)*.88);line-height:1.6}
.tps .s .t{display:inline-block;margin-top:.6em;font-size:var(--sm);color:var(--gold);border:1px solid rgba(217,164,65,.4);border-radius:100px;padding:1px 12px}
@media(max-width:900px){.tps{grid-template-columns:1fr}}
.tps-q{text-align:center;font-size:var(--h3);color:#fff;font-weight:700;padding:clamp(8px,1.4vh,16px) clamp(16px,2vw,30px);border-radius:16px;background:rgba(217,164,65,.09);border:1px solid rgba(217,164,65,.24)}

/* ===== الخطُّ الزمني ===== */
.tl{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(6px,.8vw,14px);position:relative;padding-top:clamp(14px,2vh,24px)}
.tl::before{content:'';position:absolute;left:4%;right:4%;top:calc(clamp(14px,2vh,24px) + clamp(16px,1.6vw,22px));height:2px;background:linear-gradient(to left,var(--gold),rgba(217,164,65,.2))}
.tl .e{position:relative;text-align:center}
.tl .e .n{width:clamp(32px,3.2vw,44px);height:clamp(32px,3.2vw,44px);border-radius:50%;background:var(--gold);color:var(--ink);font-family:'Sakkal Saad Poster',serif;font-weight:700;display:grid;place-items:center;margin:0 auto clamp(8px,1.2vh,14px);box-shadow:0 0 0 6px rgba(217,164,65,.18);position:relative;z-index:1}
.tl .e p{margin:0;font-size:calc(var(--tx)*.82);line-height:1.5;color:var(--cream);background:rgba(241,233,214,.06);border:1px solid rgba(241,233,214,.12);border-radius:14px;padding:clamp(8px,1.2vh,14px) clamp(8px,.8vw,12px);min-height:3.4em}
@media(max-width:900px){.tl{grid-template-columns:repeat(2,1fr)}.tl::before{display:none}}

/* ===== كلمةٌ مضيئةٌ في الآية ===== */
.verses .v mark{background:none;color:var(--gold);text-shadow:0 0 22px rgba(217,164,65,.45);border-bottom:2px solid rgba(217,164,65,.55)}

/* ===== المؤقّت (الدقيقةُ الواحدة) ===== */
.timer{position:fixed;right:clamp(16px,3vw,46px);bottom:clamp(64px,9vh,96px);z-index:18;width:clamp(96px,10vw,150px);aspect-ratio:1;display:grid;place-items:center;
  transform:scale(.6);opacity:0;pointer-events:none;transition:all .35s var(--e)}
.timer.on{transform:none;opacity:1;pointer-events:auto}
.timer svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:5}
.timer .bg{stroke:rgba(241,233,214,.14)}
.timer .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.timer.end .fg{stroke:#E0503E}
.timer .num{font-family:'Sakkal Saad Poster',serif;font-size:clamp(26px,3vw,46px);color:#fff;font-variant-numeric:tabular-nums;line-height:1}
.timer .lb{position:absolute;bottom:14%;font-size:calc(var(--sm)*.85);color:var(--dim)}
.timer.end{animation:shake .5s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ===== ملاحظةُ المعلّم ===== */
.tip{position:fixed;left:clamp(16px,3vw,46px);top:clamp(56px,8.5vh,80px);z-index:18;max-width:min(420px,60vw);background:rgba(4,22,15,.92);border:1px solid rgba(217,164,65,.4);border-radius:16px;padding:12px 16px;
  font-size:calc(var(--sm)*1.05);line-height:1.7;color:var(--cream);box-shadow:0 20px 50px -30px #000;transform:translateY(12px);opacity:0;pointer-events:none;transition:all .3s var(--e)}
.tip.on{transform:none;opacity:1;pointer-events:auto}
.tools button.hot{color:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px rgba(217,164,65,.15)}
.tip b{display:block;color:var(--gold);font-size:calc(var(--sm)*.9);margin-bottom:2px}
.tip:empty{display:none}


/* ===== الألعاب ===== */
.gq{text-align:center;font-size:var(--h3);color:var(--gold);font-weight:700;margin-bottom:clamp(4px,.8vh,10px)}
/* توصيل */
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(6px,1vh,12px) clamp(14px,2vw,34px);align-items:stretch}
.match .col{display:grid;gap:clamp(6px,1vh,12px)}
.match .mid{display:grid;gap:clamp(6px,1vh,12px);align-content:stretch}
.match .mid i{display:block;width:clamp(28px,3vw,44px);height:100%;position:relative}
.match .it{position:relative;background:rgba(241,233,214,.06);border:1.5px solid rgba(241,233,214,.14);border-radius:14px;padding:clamp(8px,1.2vh,14px) clamp(12px,1.4vw,22px);font-size:calc(var(--tx)*.95);display:flex;align-items:center;gap:10px;transition:all .4s var(--e)}
.match .it .b{flex:0 0 auto;width:clamp(24px,2.2vw,32px);height:clamp(24px,2.2vw,32px);border-radius:50%;border:1.5px dashed rgba(241,233,214,.3);display:grid;place-items:center;font-family:'Sakkal Saad Poster',serif;font-size:.85em;color:transparent;transition:all .4s}
.match .it.in{border-color:var(--gold);background:linear-gradient(to left,rgba(15,76,58,.7),rgba(15,76,58,.3));box-shadow:0 18px 40px -30px #000}
.match .it.in .b{background:var(--gold);border-style:solid;border-color:var(--gold);color:var(--ink)}
/* بطاقاتٌ تنقلب */
.flip{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:clamp(10px,1.4vw,20px);perspective:1400px}
.flip .card{position:relative;min-height:clamp(120px,18vh,190px);cursor:pointer;transform-style:preserve-3d;transition:transform .7s var(--e)}
.flip .card.in{transform:rotateY(180deg)}
.flip .f,.flip .k{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:grid;place-items:center;text-align:center;padding:clamp(12px,1.6vh,20px) clamp(12px,1.4vw,22px);font-weight:700}
.flip .f{background:linear-gradient(165deg,rgba(241,233,214,.1),rgba(241,233,214,.03));border:1px solid rgba(241,233,214,.16);color:#fff;font-size:calc(var(--tx)*1.02)}
.flip .f small{position:absolute;bottom:8px;font-size:var(--sm);color:var(--dim);font-weight:400}
.flip .k{transform:rotateY(180deg);background:linear-gradient(165deg,rgba(15,76,58,.85),rgba(15,76,58,.5));border:1.5px solid var(--gold);color:var(--cream);font-size:calc(var(--tx)*.95);font-weight:400;line-height:1.6}
/* العجلة */
.wheel{display:grid;place-items:center;gap:clamp(10px,1.6vh,20px)}
.wheel .drum{width:min(70vw,720px);height:clamp(84px,14vh,140px);border-radius:24px;border:1.5px solid rgba(217,164,65,.5);background:radial-gradient(circle at 50% 0,rgba(217,164,65,.18),rgba(15,76,58,.45) 70%);display:grid;place-items:center;font-family:'Sakkal Saad Poster',serif;font-size:clamp(24px,3.4vw,52px);color:#fff;overflow:hidden;position:relative;box-shadow:0 30px 70px -40px #000}
.wheel .drum::before,.wheel .drum::after{content:'';position:absolute;left:0;right:0;height:26%;pointer-events:none}
.wheel .drum::before{top:0;background:linear-gradient(to bottom,rgba(6,34,25,.9),transparent)}
.wheel .drum::after{bottom:0;background:linear-gradient(to top,rgba(6,34,25,.9),transparent)}
.wheel .drum.spin span{animation:blur .08s linear infinite}
@keyframes blur{50%{filter:blur(2px);transform:translateY(-6px)}}
.wheel .drum .pick{color:var(--gold);text-shadow:0 0 30px rgba(217,164,65,.5)}
.wheel .hist{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.wheel .hist span{border:1px solid rgba(241,233,214,.2);border-radius:100px;padding:2px 14px;font-size:calc(var(--tx)*.85);color:var(--dim)}
.wheel .hint{color:var(--dim);font-size:var(--sm)}
/* صيدُ الكلمات */
.hunt{display:flex;flex-wrap:wrap;gap:clamp(8px,1.1vw,16px);justify-content:center}
.hunt .w{border:1.5px solid rgba(241,233,214,.16);background:rgba(241,233,214,.05);border-radius:14px;padding:clamp(6px,1vh,12px) clamp(14px,1.6vw,26px);font-size:calc(var(--tx)*1.05);font-weight:700;cursor:pointer;transition:all .35s var(--e);position:relative}
.hunt .w.pick{border-color:rgba(241,233,214,.7);box-shadow:inset 0 0 0 2px rgba(241,233,214,.25)}
.hunt .w.in{border-color:var(--gold);background:linear-gradient(to left,rgba(15,76,58,.8),rgba(15,76,58,.4));color:#fff;transform:translateY(-3px)}
.hunt .w.in::after{content:'✓';position:absolute;top:-9px;inset-inline-start:-6px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:var(--ink);font-size:13px;display:grid;place-items:center;font-weight:700}
.hunt.done .w:not(.in){opacity:.4}
/* صحّ / خطأ */
.tf{display:grid;gap:clamp(7px,1.1vh,13px)}
.tf .it{display:flex;align-items:center;gap:clamp(10px,1.2vw,18px);background:rgba(241,233,214,.06);border:1px solid rgba(241,233,214,.13);border-radius:16px;padding:clamp(8px,1.2vh,14px) clamp(13px,1.5vw,24px);transition:all .4s var(--e)}
.tf .it .bd{flex:0 0 auto;width:clamp(34px,3.2vw,46px);height:clamp(34px,3.2vw,46px);border-radius:12px;border:1.5px dashed rgba(241,233,214,.3);display:grid;place-items:center;font-weight:700;font-size:1.1em;color:transparent;transition:all .35s}
.tf .it .s{flex:1;font-weight:700;color:#fff}
.tf .it .why{color:var(--dim);font-size:calc(var(--tx)*.82);opacity:0;transition:opacity .4s}
.tf .it.in .why{opacity:1}
.tf .it.in.ok{border-color:rgba(64,180,110,.7)}.tf .it.in.ok .bd{background:#2E9E62;border-color:#2E9E62;color:#fff}
.tf .it.in.no{border-color:rgba(224,80,62,.7)}.tf .it.in.no .bd{background:#C8412F;border-color:#C8412F;color:#fff}
/* بناءُ الجملة */
.build{display:grid;gap:clamp(12px,2vh,26px)}
.build .pool,.build .slots{display:flex;flex-wrap:wrap;gap:clamp(8px,1vw,14px);justify-content:center;min-height:clamp(46px,7vh,70px)}
.build .tile{border:1.5px solid rgba(241,233,214,.2);background:rgba(241,233,214,.07);border-radius:12px;padding:clamp(5px,.9vh,10px) clamp(12px,1.4vw,22px);font-size:calc(var(--tx)*1.05);font-weight:700;transition:all .4s var(--e)}
.build .tile.used{opacity:.18;transform:scale(.92)}
.build .slot{min-width:clamp(70px,8vw,120px);border-bottom:2px dashed rgba(217,164,65,.45);padding:clamp(5px,.9vh,10px) clamp(10px,1.2vw,18px);text-align:center;font-size:calc(var(--tx)*1.15);font-weight:700;color:transparent;transition:all .4s var(--e)}
.build .slot.in{color:#fff;border-bottom-color:var(--gold);background:rgba(217,164,65,.1);border-radius:10px 10px 0 0}
.build .lbl{text-align:center;color:var(--dim);font-size:var(--sm)}
/* وسمُ الأركان */
.tag .sent{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(10px,1.4vw,22px) clamp(10px,1.2vw,18px);align-items:flex-start;padding:clamp(10px,1.6vh,20px) 0}
.tag .wd{display:grid;justify-items:center;gap:6px;font-size:clamp(22px,2.6vw,42px);font-weight:700;color:#fff;font-family:'Sakkal Saad Poster',serif}
.tag .wd .r{font-family:'Sakkal Saad',sans-serif;font-size:var(--sm);font-weight:700;border-radius:100px;padding:1px 12px;opacity:0;transform:translateY(-6px);transition:all .4s var(--e);color:var(--ink);background:var(--rc,var(--gold))}
.tag .wd.in .r{opacity:1;transform:none}
.tag .wd.in{color:var(--rc,var(--gold))}
.tag .legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tag .legend span{font-size:var(--sm);border-radius:100px;padding:1px 12px;color:var(--ink);background:var(--rc);font-weight:700}


/* ===== طبقةُ التفاعلِ الجماعي ===== */
/* تصويتٌ على الخيارات */
.opts .o{cursor:pointer;position:relative}
.opts .o .cnt{position:absolute;top:-10px;inset-inline-end:10px;min-width:26px;height:26px;border-radius:100px;background:var(--cream);color:var(--ink);font-family:'Sakkal Saad Poster',serif;font-size:15px;display:grid;place-items:center;padding:0 8px;opacity:0;transform:scale(.6);transition:all .25s var(--e)}
.opts .o .cnt.on{opacity:1;transform:none}
.opts .o.in.right .cnt{background:var(--gold)}
/* تخمينُ صحّ/خطأ */
.tf .it{cursor:pointer}
.tf .it .bd::after{content:attr(data-g);position:absolute;font-size:.9em;color:var(--cream)}
.tf .it{position:relative}
.tf .it .bd{position:relative;overflow:visible}
.tf .it:not(.in) .bd[data-g]{border-style:solid;border-color:rgba(241,233,214,.7)}
.tf .it.in .bd::after{display:none}
.tf .it.in.good{box-shadow:0 0 0 2px rgba(64,180,110,.5)}
.tf .it.in.miss{box-shadow:0 0 0 2px rgba(224,80,62,.6)}
/* اقتراحُ التوصيل */
.match .it{cursor:pointer}
.match .it.sel{border-color:rgba(241,233,214,.8);box-shadow:inset 0 0 0 2px rgba(241,233,214,.25)}
.match .it .pp{position:absolute;top:-10px;inset-inline-end:12px;min-width:24px;height:24px;border-radius:100px;background:var(--cream);color:var(--ink);font-family:'Sakkal Saad Poster',serif;font-size:14px;display:grid;place-items:center;padding:0 7px;opacity:0;transition:all .25s}
.match .it .pp.on{opacity:1}
.match .it.in.good .pp{background:#2E9E62;color:#fff}
.match .it.in.miss .pp{background:#C8412F;color:#fff;text-decoration:line-through}
/* بناءُ الجملةِ بالنقر */
.build .tile{cursor:pointer}
.build .slot .g{display:block;color:var(--cream);font-size:.8em;opacity:.85}
.build .slot:not(.in){color:transparent}
.build .slot.in .g{display:none}
.build .slot.in.miss{background:rgba(200,65,47,.18);border-bottom-color:#C8412F}
.build .slot.in.miss::after{content:attr(data-g);display:block;font-size:.65em;color:#F0A090;text-decoration:line-through}
/* سحبُ الترتيب */
.order .o{cursor:grab;user-select:none;touch-action:none}
.order .o .hd{cursor:grab}
.order .o.drag{opacity:.5;border-style:dashed}
.order .o .hd{flex:0 0 auto;opacity:.35;font-size:.9em}
/* فقاعاتُ العصفِ تُكتَب */
.bs .bub .you{display:block;min-height:1.2em;color:var(--cream);outline:none;font-weight:700}
.bs .bub .you:empty::before{content:'';}
.bs .bub .idea{display:none}
.bs .bub.in .idea{display:block}
.bs .bub.in .you{font-size:.72em;font-weight:400;color:rgba(241,233,214,.75);border-bottom:1px dashed rgba(241,233,214,.25);margin-bottom:2px}
.bs .bub.in .you:empty{display:none}
.bs .bub:not(.in) .you{cursor:text}
.bs .bub:not(.in):focus-within{border-color:var(--gold);border-style:solid}
.bs .bub:not(.in) .you:not(:empty)~.idea{display:none}

/* صيدُ الكلمات: الاختيارُ الخاطئُ بعدَ الكشف */
.hunt.done .w.pick:not(.in){opacity:1;border-color:#C8412F;box-shadow:inset 0 0 0 2px rgba(200,65,47,.35)}
.rnd{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(4,22,15,.86);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s}
.rnd.on{opacity:1;pointer-events:auto}
/* لوحةُ النقاط */
.score{position:fixed;top:clamp(56px,8.5vh,80px);right:clamp(16px,3vw,46px);z-index:18;display:flex;gap:10px;opacity:0;pointer-events:none;transform:translateY(-8px);transition:all .3s var(--e)}
.score.on{opacity:1;pointer-events:auto;transform:none}
.score .tm{background:rgba(4,22,15,.9);border:1px solid rgba(241,233,214,.2);border-radius:16px;padding:8px 12px;text-align:center;min-width:110px}
.score .tm b{display:block;font-size:var(--sm);color:var(--gold);outline:none}
.score .tm .v{font-family:'Sakkal Saad Poster',serif;font-size:clamp(26px,3vw,44px);color:#fff;line-height:1.1}
.score .tm .bt{display:flex;justify-content:center;gap:6px;margin-top:4px}
.score .tm button{width:28px;height:28px;border-radius:50%;border:1px solid rgba(241,233,214,.3);font-size:18px;line-height:1}
.score .tm button:hover{background:rgba(241,233,214,.14)}
/* وسمُ الأركان: المفتاحُ بعدَ الكشفِ كلِّه */
.tag .legend{opacity:0;transition:opacity .4s}
.tag.done .legend{opacity:1}


/* الاختيارُ العشوائيُّ من قائمةِ الفصل */
.rnd{background:radial-gradient(60% 60% at 50% 42%,rgba(217,164,65,.14),transparent 70%),rgba(4,22,15,.93)}
.rnd .box{text-align:center;max-width:min(94vw,1000px);padding:0 20px}
.rnd .pkcls{display:inline-block;font-size:var(--sm);color:var(--gold);border:1px solid rgba(217,164,65,.4);border-radius:100px;padding:2px 18px;margin-bottom:clamp(10px,1.8vh,22px)}
.rnd .ring{width:clamp(96px,13vw,168px);height:clamp(96px,13vw,168px);margin:0 auto clamp(10px,1.8vh,22px);border-radius:50%;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 50% 30%,rgba(217,164,65,.3),rgba(15,76,58,.6) 70%);border:2px solid rgba(217,164,65,.55);box-shadow:0 0 0 clamp(8px,1.2vw,16px) rgba(217,164,65,.07),0 30px 70px -40px #000}
.rnd .ring::after{content:'';position:absolute;inset:-14px;border-radius:50%;border:2px dashed rgba(217,164,65,.35);animation:pkspin 9s linear infinite}
@keyframes pkspin{to{transform:rotate(360deg)}}
.rnd.rolling .ring::after{animation-duration:1.1s}
.rnd .ring .av{font-family:'Sakkal Saad Poster',serif;font-size:clamp(38px,5.6vw,76px);color:#fff;line-height:1}
.rnd .nm{font-family:'Sakkal Saad Poster',serif;font-size:clamp(40px,7.4vw,110px);color:#fff;line-height:1.15;text-shadow:0 0 60px rgba(217,164,65,.45);min-height:1.15em}
.rnd .nm.spin{color:rgba(241,233,214,.5);text-shadow:none}
.rnd .rule{width:clamp(80px,9vw,140px);height:3px;background:var(--gold);border-radius:3px;margin:clamp(8px,1.4vh,16px) auto 0;transform:scaleX(0);transition:transform .5s var(--e)}
.rnd:not(.rolling) .rule{transform:scaleX(1)}
.rnd .no{color:var(--gold);font-size:var(--h3);margin-top:.35em}
.rnd .box.land .nm{animation:pkpop .55s var(--e)}
@keyframes pkpop{0%{transform:scale(.86);opacity:.4}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.rnd .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:clamp(14px,2.4vh,26px)}
.rnd .acts button{border:1px solid rgba(241,233,214,.3);border-radius:100px;padding:6px 20px;font-size:calc(var(--tx)*.9);font-weight:700;color:var(--cream)}
.rnd .acts button:hover{background:rgba(241,233,214,.12)}
.rnd .acts button.p{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.rnd .st{color:var(--dim);font-size:var(--sm);margin-top:14px}
.rnd .st b{color:var(--cream)}
.rnd .cls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:clamp(14px,2.4vh,26px)}
.rnd .cls button{border:1px solid rgba(241,233,214,.25);border-radius:100px;padding:5px 18px;font-size:calc(var(--tx)*.9);color:var(--cream)}
.rnd .cls button.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.rnd .cls button:hover{border-color:var(--gold)}
.rnd .ttl{color:var(--gold);font-size:var(--h3);font-weight:700;margin-bottom:8px}
.top .pill{font-size:var(--sm);color:var(--cream);border:1px solid rgba(241,233,214,.25);border-radius:100px;padding:1px 12px;cursor:pointer;white-space:nowrap;margin-inline-start:10px}
.top .pill:hover{border-color:var(--gold);color:var(--gold)}
.top .pill:empty{display:none}
.hintbar{bottom:clamp(54px,8.5vh,76px)}

/* ===== ظهورُ الخطوات ===== */
.step{opacity:0;transform:translateY(14px);transition:opacity .4s var(--e),transform .45s var(--e)}
.step.in{opacity:1;transform:none}
.step.keep{opacity:1;transform:none}
.match .it.keep:not(.in){opacity:.72}
.opts .o.keep:not(.in){opacity:1}

/* ===== الفهرس ===== */
.map{position:fixed;inset:0;z-index:20;background:rgba(4,22,15,.94);backdrop-filter:blur(8px);padding:var(--pad);overflow:auto}
.map h3{font-size:var(--h3);color:var(--gold);margin-bottom:16px}
.map .g{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.map button{text-align:start;background:rgba(241,233,214,.06);border:1px solid rgba(241,233,214,.12);border-radius:14px;padding:11px 15px;transition:all .2s var(--e)}
.map button:hover,.map button.cur{border-color:var(--gold);background:rgba(217,164,65,.14)}
.map button i{display:block;font-style:normal;color:var(--gold);font-size:var(--sm);font-weight:700}
.map button span{font-size:calc(var(--tx)*.85);color:var(--cream)}

.hintbar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:15;font-size:calc(var(--sm)*.95);color:var(--dim);
  background:rgba(4,22,15,.7);border:1px solid rgba(241,233,214,.12);border-radius:100px;padding:4px 16px;transition:opacity .5s}
.hintbar.off{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div class="bg"></div>
<div class="stage">
  <div class="top">
    <div class="id"><img src="/img/logo-cream.svg" alt=""><div><b id="tTitle">—</b><small id="tSub"></small></div></div>
    <div style="display:flex;align-items:center;min-width:0"><div class="kick" id="tKick"></div><span class="pill" id="clsPill" title="فصلُ الحصّة — انقرْ للتغيير"></span></div>
  </div>
  <div class="slidewrap" id="wrap"></div>
  <div class="bottom">
    <div class="tools">
      <button id="bPrev" title="السابق"><svg viewBox="0 0 24 24"><path d="M10 6l6 6-6 6"/></svg></button>
      <button id="bNext" title="التالي"><svg viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6"/></svg></button>
      <button id="bMap" title="فهرسُ الشرائح (Esc)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></button>
      <button id="bFull" title="ملءُ الشاشة (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 15v5h-5M20 9V4h-5M4 15v5h5"/></svg></button>
      <button id="bRnd" title="اختيارُ طالبٍ عشوائيّاً (R)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.3" fill="currentColor"/><circle cx="15" cy="15" r="1.3" fill="currentColor"/><circle cx="15" cy="9" r="1.3" fill="currentColor"/><circle cx="9" cy="15" r="1.3" fill="currentColor"/></svg></button>
      <button id="bScore" title="لوحةُ النقاط (S)"><svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4.5v2a3 3 0 0 0 3 3M17 6h2.5v2a3 3 0 0 1-3 3"/><path d="M12 14v3M9 20h6"/></svg></button>
      <button id="bTimer" title="مؤقّتُ الدقيقةِ الواحدة (T)"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4.5l3 2M9.5 3.5h5M12 3.5v2"/></svg></button>
      <button id="bTip" title="ملاحظةُ المعلّم (N)"><svg viewBox="0 0 24 24"><path d="M9.5 18.5h5M10 21h4"/><path d="M12 3.5a6 6 0 0 0-3.5 10.9c.7.6 1 1.3 1 2.1h5c0-.8.3-1.5 1-2.1A6 6 0 0 0 12 3.5z"/></svg></button>
      <button id="bBack" title="العودةُ للتحضير"><svg viewBox="0 0 24 24"><path d="M5 3.5h9.5L19 8v12.5H5z"/><path d="M14.5 3.5V8H19"/><path d="M8 12h8M8 15.5h5"/></svg></button>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div class="count" id="count">—</div>
  </div>
</div>
<div class="map" id="map" hidden><h3>شرائحُ العرض</h3><div class="g" id="mapG"></div></div>
<div class="hintbar" id="hintbar">المسافةُ تكشفُ الخطوةَ التالية · انقرِ الخياراتِ للتصويت · اسحبِ الترتيبَ بالفأرة · W كتابةُ فكرةِ طالبٍ في العصف · R طالبٌ عشوائيّ · S النقاط · T مؤقّت · N ملاحظةُ المعلّم</div>
<div class="timer" id="timer"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="tfg" cx="50" cy="50" r="44"/></svg><div class="num" id="tnum">٦٠</div><div class="lb">ثانية</div></div>
<div class="tip" id="tip"></div>
<div class="rnd" id="rnd"><div class="box" id="rndBox"></div></div>
<div class="score" id="score">
  <div class="tm"><b contenteditable spellcheck="false">الفريقُ الأوّل</b><div class="v" data-t="0">٠</div><div class="bt"><button data-d="-1" data-t="0">−</button><button data-d="1" data-t="0">+</button></div></div>
  <div class="tm"><b contenteditable spellcheck="false">الفريقُ الثاني</b><div class="v" data-t="1">٠</div><div class="bt"><button data-d="-1" data-t="1">−</button><button data-d="1" data-t="1">+</button></div></div>
</div>

<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var nl=function(x){return esc(fill(x)).replace(/\n/g,'<br>').replace(/ {2,}/g,function(m){return new Array(m.length+1).join(' ')})};
var ar=function(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]})};
var arInt=function(t){return +String(t).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)})||0};
var ID=new URLSearchParams(location.search).get('id')||'';
var D=null, S=[], i=0, step=0;
var ME={name:'أ. حيدر المعاتيق',short:'حيدر المعاتيق',school:'ثانوية طلحة بن عبيدالله. بنين - قسم اللغة العربية'};
/* {{teacher}} و{{school}} تُستبدلانِ باسمِ المعلّمِ الداخلِ ومدرستِه */
function fill(x){return String(x==null?'':x).replace(/\{\{teacher\}\}/g,ME.short).replace(/\{\{school\}\}/g,ME.school)}


/* رسومٌ خطّيّةٌ بسيطة تُرسَمُ أمامَ الطلبة */
var ART={
  river:'<svg viewBox="0 0 400 300"><circle cx="330" cy="58" r="22" class="g draw"/><path class="g draw" d="M318 44a22 22 0 1 0 24 30 17 17 0 0 1-24-30z"/>'
   +'<g class="w"><path class="draw" d="M0 200c30-12 60-12 90 0s60 12 90 0 60-12 90 0 60 12 90 0 30-8 40-6"/><path class="draw" d="M0 232c30-12 60-12 90 0s60 12 90 0 60-12 90 0 60 12 90 0 30-8 40-6"/><path class="draw" d="M0 264c30-12 60-12 90 0s60 12 90 0 60-12 90 0 60 12 90 0 30-8 40-6"/></g>'
   +'<g class="float"><path class="f" d="M150 196c0 18 24 30 50 30s50-12 50-30l-8-14H158z"/><path class="g draw" d="M150 196c0 18 24 30 50 30s50-12 50-30l-8-14H158z"/><path class="c draw" d="M158 182h84M165 190h70"/><path class="g draw" d="M172 182c8-16 16-22 28-22s20 6 28 22"/></g>'
   +'<g class="c"><path class="draw" d="M40 200v-70M40 130l-12-18M40 150l14-16M40 118l10-14"/><path class="draw" d="M70 200v-52M70 148l-10-14M70 162l10-12"/><path class="draw" d="M350 200v-60M350 140l-11-16M350 158l12-14"/></g></svg>',
  palace:'<svg viewBox="0 0 400 300"><g class="g"><path class="draw" d="M40 240h320"/><path class="draw" d="M70 240V120h30v120M130 240V110h30v130M240 240V110h30v130M300 240V120h30v120"/><path class="draw" d="M60 120h260l-16-30H76z"/><path class="draw" d="M180 240v-70a20 20 0 0 1 40 0v70"/><path class="draw" d="M100 90l100-40 100 40"/></g>'
   +'<g class="c"><path class="draw" d="M100 130v20M330 130v20M62 260h276"/></g><circle class="f" cx="200" cy="48" r="10"/></svg>',
  heart:'<svg viewBox="0 0 400 300"><path class="f" d="M200 250C130 200 80 160 80 110a50 50 0 0 1 95-22 50 50 0 0 1 95 22c0 50-50 90-70 140z"/><path class="g draw" d="M200 250C130 200 80 160 80 110a50 50 0 0 1 95-22 50 50 0 0 1 95 22c0 50-50 90-70 140z"/>'
   +'<g class="c"><path class="draw" d="M96 150c30 12 60 14 90 12 40-3 70-14 118-10"/><path class="draw" d="M104 178c30 10 60 12 90 10 40-3 70-12 110-8"/><path class="draw" d="M120 122c26 9 52 11 80 10 34-2 62-10 100-6"/></g>'
   +'<g class="g"><path class="draw" d="M304 150l14-6-6 14M326 172l14-6-6 14"/></g></svg>',
  eye:'<svg viewBox="0 0 400 300"><path class="g draw" d="M60 150c50-70 230-70 280 0-50 70-230 70-280 0z"/><circle class="g draw" cx="200" cy="150" r="34"/><circle class="f" cx="200" cy="150" r="16"/>'
   +'<g class="w"><path class="draw" d="M0 250c40-10 80-10 120 0s80 10 120 0 80-10 120 0 30-4 40-2"/></g><g class="c"><path class="draw" d="M330 60l14 14M340 46l10 10M354 66l-10-10"/></g></svg>'
};

/* ============ بناءُ الشرائح ============ */
function tick(){return '<span class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>'}
function head(t){return '<div class="head"><span class="dot"></span><h2>'+nl(t)+'</h2><span class="ln"></span></div>'}
function ansList(a,from){
  return '<div class="ans">'+a.map(function(x,k){return '<div class="a step" data-s="'+(from+k)+'">'+tick()+'<div>'+nl(x)+'</div></div>'}).join('')+'</div>';
}
var B={
  cover:function(s){
    return '<div class="cover">'
      +'<img class="mark" src="/img/logo-cream.svg" alt="">'
      +(s.over?'<div class="over">'+nl(s.over)+'</div>':'')
      +'<h1>'+nl(s.title)+'</h1><div class="rule"></div>'
      +(s.meta?'<div class="meta">'+s.meta.map(function(m){return '<div>'+nl(m.k)+' <b>'+nl(m.v)+'</b></div>'}).join('')+'</div>':'')
      +'</div>';
  },
  divider:function(s){
    return '<div class="divider">'+(s.n?'<div class="n">'+nl(s.n)+'</div>':'')
      +'<h2>'+nl(s.title)+'</h2>'+(s.sub?'<p>'+nl(s.sub)+'</p>':'')+'</div>';
  },
  outcomes:function(s){
    return head(s.title||'نواتجُ التعلّم')
      +'<ul class="outs">'+s.items.map(function(x,k){
        return '<li class="step" data-s="'+k+'"><span class="i">'+ar(k+1)+'</span><span>'+nl(x)+'</span></li>'}).join('')+'</ul>';
  },
  verses:function(s){
    return (s.title?head(s.title):'')
      +'<div class="verses">'+s.items.map(function(v,k){
        var t=nl(v.t); (v.hl||[]).forEach(function(w){t=t.split(esc(w)).join('<mark>'+esc(w)+'</mark>')});
        return '<div class="v step" data-s="'+k+'">'+t+(v.n?'<em>'+nl(v.n)+'</em>':'')+'</div>'}).join('')
      +(s.src?'<div class="src">'+nl(s.src)+'</div>':'')+'</div>';
  },
  question:function(s){
    var h='', n=0;
    h+='<div class="q">'+(s.n?'<span class="n">'+nl(s.n)+'</span>':'')+'<span>'+nl(s.q)+'</span></div>';
    if(s.quote) h+='<div class="quote">'+nl(s.quote)+'</div>';
    if(s.verse) h+='<div class="verseline">'+(s.vlabel?'<span class="lbl">'+nl(s.vlabel)+'</span>':'')
      +'<span class="sh">'+String(s.verse).split(/\s{2,}/).map(function(x){return '<span>'+nl(x)+'</span>'}).join('')+'</span></div>';
    if(s.prompt) h+='<div class="prompt">'+nl(s.prompt)+'</div>';
    if(s.fill) h+='<div class="fill">'+s.fill.map(function(w){
      var m=/^\[\[([\s\S]*)\]\]$/.exec(w);
      return m?'<span class="w b hide step" data-s="'+(n++)+'" data-fill="1">'+nl(m[1])+'</span>':'<span class="w">'+nl(w)+'</span>';
    }).join('')+'</div>';
    if(s.options) h+='<div class="opts">'+s.options.map(function(o){
      return '<div class="o'+(o.correct?' right':'')+' step keep" data-s="'+n+'" data-opt="1"><span class="b"></span><span>'+nl(o.text)+'</span><span class="cnt">٠</span></div>'}).join('')+'</div>', n++;
    if(s.order) h+='<div class="order">'+s.order.map(function(o,k){
      return '<div class="o step" data-s="'+(n+k)+'" data-order="1"><span class="num">'+nl(o.n)+'</span><span>'+nl(o.t)+'</span><span class="hd">⋮⋮</span></div>'}).join('')+'</div>', n+=s.order.length;
    if(s.a) h+=ansList(s.a,n), n+=s.a.length;
    if(s.table) h+=tableHTML(s.table,n), n++;
    return h;
  },
  table:function(s){
    return (s.title?head(s.title):'')+tableHTML(s.table,0);
  },

  brainstorm:function(s){
    var n=s.ideas.length, RX=Math.min(34,22+n*2.4), RY=27, rays='', bubs='';
    for(var k=0;k<n;k++){
      var a=-90+k*(360/n), rad=a*Math.PI/180;
      var x=Math.cos(rad)*RX, y=Math.sin(rad)*RY;
      rays+='<span class="ray" style="--a:'+a+'deg;--len:'+(RX*0.85)+'vw"></span>';
      bubs+='<div class="bub step" data-s="'+k+'" data-i="'+ar(k+1)+'" style="--x:'+x+'vw;--y:'+y+'vh"><span class="you" contenteditable spellcheck="false"></span><span class="idea">'+nl(s.ideas[k])+'</span></div>';
    }
    return head(s.title||'عصفٌ ذهني')
      +'<div class="bs">'+rays+'<div class="core"><small>'+nl(s.kick||'فكّرْ… ثمّ شارِكْ')+'</small>'+nl(s.q)+'</div>'+bubs+'</div>';
  },
  scene:function(s){
    return '<div class="scene"><div class="art">'+(ART[s.art]||'')+'</div><div class="txt">'
      +'<h2>'+nl(s.title)+'</h2>'+(s.p?'<p>'+nl(s.p)+'</p>':'')+(s.ask?'<div class="ask step" data-s="0">'+nl(s.ask)+'</div>':'')+'</div></div>';
  },
  think:function(s){
    return head(s.title||'فكّر — زاوج — شارك')
      +'<div class="tps-q">'+nl(s.q)+'</div>'
      +'<div class="tps">'
      +'<div class="s step" data-s="0"><div class="k">١</div><b>فكّرْ</b><span>'+nl(s.think||'وحدَك، اكتبْ فكرةً واحدةً على الأقلّ')+'</span><i class="t">دقيقة</i></div>'
      +'<div class="s step" data-s="1"><div class="k">٢</div><b>زاوِجْ</b><span>'+nl(s.pair||'ناقشْ زميلَك واتّفقا على أقوى فكرة')+'</span><i class="t">دقيقتان</i></div>'
      +'<div class="s step" data-s="2"><div class="k">٣</div><b>شارِكْ</b><span>'+nl(s.share||'اعرضا فكرتَكما على الصفّ')+'</span><i class="t">للصفّ</i></div>'
      +'</div>';
  },
  timeline:function(s){
    return head(s.title||'تسلسلُ الأحداث')
      +'<div class="tl">'+s.items.map(function(t,k){return '<div class="e step" data-s="'+k+'"><div class="n">'+ar(k+1)+'</div><p>'+nl(t)+'</p></div>'}).join('')+'</div>';
  },

  match:function(s){
    var n=s.pairs.length, rot=Math.max(1,Math.floor(n/2)), right=s.pairs.map(function(p,k){return {t:p[1],k:k}});
    right=right.slice(rot).concat(right.slice(0,rot));   /* عمودٌ مبعثَر */
    return head(s.title||'صِلْ بين')+(s.q?'<div class="gq">'+nl(s.q)+'</div>':'')
      +'<div class="match"><div class="col">'+s.pairs.map(function(p,k){return '<div class="it step keep" data-side="r" data-s="'+k+'"><span class="b">'+ar(k+1)+'</span><span>'+nl(p[0])+'</span><span class="pp"></span></div>'}).join('')+'</div>'
      +'<div class="mid">'+s.pairs.map(function(){return '<i></i>'}).join('')+'</div>'
      +'<div class="col">'+right.map(function(r){return '<div class="it step keep" data-side="l" data-s="'+r.k+'"><span class="b">'+ar(r.k+1)+'</span><span>'+nl(r.t)+'</span><span class="pp"></span></div>'}).join('')+'</div></div>';
  },
  flip:function(s){
    return head(s.title||'بطاقاتٌ تنقلب')+(s.q?'<div class="gq">'+nl(s.q)+'</div>':'')
      +'<div class="flip">'+s.cards.map(function(c,k){return '<div class="card step keep" data-s="'+k+'" data-flip="1"><div class="f">'+nl(c.q)+'<small>انقرْ للقلب</small></div><div class="k">'+nl(c.a)+'</div></div>'}).join('')+'</div>';
  },
  wheel:function(s){
    return head(s.title||'العجلة')+(s.q?'<div class="gq">'+nl(s.q)+'</div>':'')
      +'<div class="wheel" data-wheel=\''+esc(JSON.stringify(s.items))+'\'><div class="drum"><span>؟</span></div>'
      +'<div class="hist">'+s.items.map(function(x,k){return '<span class="step" data-s="'+k+'" data-hist="1" style="visibility:hidden">'+nl(x)+'</span>'}).join('')+'</div>'
      +'<div class="hint">'+nl(s.hint||'المسافةُ تُديرُ العجلة')+'</div></div>';
  },
  hunt:function(s){
    var n=0;
    return head(s.title||'صيدُ الكلمات')+(s.q?'<div class="gq">'+nl(s.q)+'</div>':'')
      +'<div class="hunt" data-hunt="1">'+s.words.map(function(w){var o=typeof w==='string'?{w:w}:w;
        return o.hit?'<span class="w step keep" data-s="'+(n++)+'" data-hw="1">'+nl(o.w)+'</span>':'<span class="w" data-hw="1">'+nl(o.w)+'</span>'}).join('')+'</div>';
  },
  tf:function(s){
    return head(s.title||'صحٌّ أم خطأ؟')+(s.q?'<div class="gq">'+nl(s.q)+'</div>':'')
      +'<div class="tf">'+s.items.map(function(it,k){return '<div class="it step keep '+(it.ok?'ok':'no')+'" data-s="'+k+'"><span class="bd">'+(it.ok?'✓':'✗')+'</span><span class="s">'+nl(it.s)+'</span>'+(it.why?'<span class="why">'+nl(it.why)+'</span>':'')+'</div>'}).join('')+'</div>';
  },
  build:function(s){
    var tiles=s.tiles||s.answer.slice().reverse();
    return head(s.title||'ابنِ الجملة')+(s.q?'<div class="gq">'+nl(s.q)+'</div>':'')
      +'<div class="build"><div class="lbl">البلاطات</div><div class="pool">'+tiles.map(function(t){return '<span class="tile" data-t="'+esc(t)+'">'+nl(t)+'</span>'}).join('')+'</div>'
      +'<div class="lbl">الجملةُ الصحيحة</div><div class="slots">'+s.answer.map(function(t,k){return '<span class="slot step keep" data-s="'+k+'" data-t="'+esc(t)+'">'+nl(t)+'<span class="g"></span></span>'}).join('')+'</div></div>';
  },
  tag:function(s){
    var roles={}; (s.roles||[]).forEach(function(r){roles[r.k]=r});
    var n=0;
    return head(s.title||'حدِّدِ الأركان')+(s.q?'<div class="gq">'+nl(s.q)+'</div>':'')
      +'<div class="tag"><div class="sent">'+s.sentence.map(function(w){var o=typeof w==='string'?{w:w}:w, r=o.r&&roles[o.r];
        return r?'<span class="wd step keep" data-s="'+(n++)+'" style="--rc:'+r.color+'">'+nl(o.w)+'<span class="r">'+nl(r.name)+'</span></span>':'<span class="wd">'+nl(o.w)+'</span>'}).join('')+'</div>'
      +'<div class="legend">'+(s.roles||[]).map(function(r){return '<span style="--rc:'+r.color+'">'+nl(r.name)+'</span>'}).join('')+'</div></div>';
  },
  points:function(s){
    return head(s.title||'الخلاصة')
      +'<div class="points">'+s.items.map(function(p,k){
        return '<div class="p step" data-s="'+k+'">'+(p.g?'<div class="g">'+nl(p.g)+'</div>':'')
          +'<b>'+nl(p.t)+'</b>'+(p.d?'<span>'+nl(p.d)+'</span>':'')+'</div>'}).join('')+'</div>';
  }
};
function tableHTML(t,s){
  return '<table class="t step" data-s="'+s+'"><thead><tr>'+t.head.map(function(h){return '<th>'+nl(h)+'</th>'}).join('')+'</tr></thead><tbody>'
    +t.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+nl(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>';
}

/* ============ العرض ============ */
function build(){
  $('wrap').innerHTML=S.map(function(s,k){
    var fn=B[s.t]||B.question;
    return '<section class="slide" data-k="'+k+'">'+fn(s)+'</section>';
  }).join('');
  $('mapG').innerHTML=S.map(function(s,k){
    return '<button data-go="'+k+'"><i>'+ar(k+1)+'</i><span>'+esc(s.title||s.q||s.over||'شريحة')+'</span></button>';
  }).join('');
  $('mapG').onclick=function(e){var b=e.target.closest('[data-go]');if(!b)return;go(+b.dataset.go);$('map').hidden=true};
}
function slides(){return $('wrap').querySelectorAll('.slide')}
function steps(k){return slides()[k].querySelectorAll('.step')}
function total(k){ var m=0; [].forEach.call(steps(k),function(el){ m=Math.max(m,(el.dataset.s!=null?+el.dataset.s:0)+1); }); return m; }
function show(k,atEnd){
  var all=slides();
  [].forEach.call(all,function(el,n){
    el.classList.toggle('on',n===k);
    el.classList.toggle('out',n<k);
  });
  i=k;
  step=atEnd?total(k):0;
  paint();
  $('count').textContent=ar(k+1)+' / '+ar(S.length);
  tStop(); tipPaint();
  $('bTimer').classList.toggle('hot',!!(S[k]&&S[k].timer));
  $('prog').style.width=((k+1)/S.length*100)+'%';
  var cur=$('mapG').querySelector('.cur'); if(cur)cur.classList.remove('cur');
  var nb=$('mapG').querySelector('[data-go="'+k+'"]'); if(nb)nb.classList.add('cur');
  try{history.replaceState(null,'','?id='+encodeURIComponent(ID)+'#'+(k+1))}catch(e){}
}
var lastStep={};
function paint(){
  var sl=slides()[i];
  [].forEach.call(steps(i),function(el,n){
    var on=(el.dataset.s!=null?+el.dataset.s:n)<step;
    if(el.dataset.order){ var pos=[].indexOf.call(el.parentNode.children,el); on=pos<step;
      if(on){ var want=arInt(el.querySelector('.num').textContent); el.classList.toggle('ok',want===pos+1); el.classList.toggle('bad',want!==pos+1); }
      else el.classList.remove('ok','bad'); }
    el.classList.toggle('in',on);
    if(el.dataset.fill) el.classList.toggle('hide',!on);
    if(el.dataset.order) el.classList.toggle('show',on);
    if(el.dataset.opt) el.classList.toggle('dim',on&&!el.classList.contains('right'));
    if(el.dataset.hist) el.style.visibility=on?'visible':'hidden';
  });
  /* نتائجُ التخمينات */
  sl.querySelectorAll('.tf .it.in').forEach(function(it){ var g=it.querySelector('.bd').getAttribute('data-g'); if(!g)return; var ok=it.classList.contains('ok'); it.classList.toggle('good',(g==='✓')===ok); it.classList.toggle('miss',(g==='✓')!==ok); });
  sl.querySelectorAll('.match .it.in[data-pp]').forEach(function(it){ var box=it.closest('.match'); var mate=[].filter.call(box.querySelectorAll('.it[data-pp="'+it.dataset.pp+'"]'),function(x){return x!==it})[0]; if(!mate)return; var ok=mate.dataset.s===it.dataset.s; it.classList.toggle('good',ok); it.classList.toggle('miss',!ok); });
  sl.querySelectorAll('.build .slot.in[data-g]').forEach(function(x){ x.classList.toggle('miss',x.dataset.g!==x.dataset.t); });
  var tg=sl.querySelector('.tag'); if(tg) tg.classList.toggle('done',step>=total(i)&&total(i)>0);
  if(step===0) resetPlay(sl);
  /* صيدُ الكلمات: بعدَ آخرِ خطوةٍ تخفتُ الكلماتُ الأخرى */
  var h=sl.querySelector('.hunt'); if(h) h.classList.toggle('done',step>=total(i)&&total(i)>0);
  /* البناء: البلاطةُ المستعمَلةُ تخفت */
  var b=sl.querySelector('.build'); if(b){ var used={}; b.querySelectorAll('.slot.in').forEach(function(x){used[x.dataset.t]=1});
    b.querySelectorAll('.tile').forEach(function(t){t.classList.toggle('used',!!used[t.dataset.t])}); }
  /* العجلة: كلُّ خطوةٍ دورةٌ تنتهي على العنصرِ التالي */
  var w=sl.querySelector('.wheel'); if(w){ var items=JSON.parse(w.dataset.wheel), d=w.querySelector('.drum'), sp=d.querySelector('span');
    if(step>0 && lastStep[i]!==step){ lastStep[i]=step; spin(d,sp,items,step-1); }
    else if(step===0){ sp.textContent='؟'; sp.className=''; lastStep[i]=0; }
  }
}
function spin(d,sp,items,target){
  var n=0, total=14+target, k=(target+items.length-total%items.length)%items.length;
  d.classList.add('spin'); sp.className='';
  (function tick(){
    sp.textContent=items[k%items.length]; k++; n++;
    if(n<total) setTimeout(tick, 40+Math.pow(n/total,2.2)*260);
    else { d.classList.remove('spin'); sp.textContent=items[target]; sp.className='pick'; }
  })();
}
function next(){ if(step<total(i)){step++;paint();return} if(i<S.length-1) show(i+1); }
function prev(){ if(step>0){step--;paint();return} if(i>0) show(i-1,true); }
function go(k){ if(k>=0&&k<S.length) show(k); }



/* ===== طبقةُ التفاعلِ الجماعي ===== */
var dragging=false;
function resetPlay(sl){ /* عندَ العودةِ إلى بدايةِ الشريحة */
  sl.querySelectorAll('.opts .cnt').forEach(function(c){c.textContent='٠';c.classList.remove('on')});
  sl.querySelectorAll('.tf .bd').forEach(function(b){b.removeAttribute('data-g')});
  sl.querySelectorAll('.tf .it').forEach(function(b){b.classList.remove('good','miss')});
  sl.querySelectorAll('.match .it').forEach(function(x){x.classList.remove('sel','good','miss');var pp=x.querySelector('.pp');if(pp){pp.textContent='';pp.classList.remove('on')}});
  sl.querySelectorAll('.build .slot').forEach(function(x){x.removeAttribute('data-g');x.classList.remove('miss');var g=x.querySelector('.g');if(g)g.textContent=''});
  sl.querySelectorAll('.hunt .w').forEach(function(x){x.classList.remove('pick')});
}
function vote(o){ var c=o.querySelector('.cnt'); if(!c||o.classList.contains('in'))return; var v=(parseInt(c.textContent.replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}),10)||0)+1; c.textContent=ar(v); c.classList.add('on'); }
var selMatch=null;
function propose(it){
  var box=it.closest('.match'); if(it.classList.contains('in')) return;
  if(!selMatch){ selMatch=it; it.classList.add('sel'); return; }
  if(selMatch===it){ it.classList.remove('sel'); selMatch=null; return; }
  if(selMatch.dataset.side===it.dataset.side){ selMatch.classList.remove('sel'); selMatch=it; it.classList.add('sel'); return; }
  /* زوجٌ مقترَح: حرفٌ واحدٌ للطرفَين */
  var used=[].map.call(box.querySelectorAll('.pp.on'),function(p){return p.textContent}); var L='أبجدهوزحطي'.split('').filter(function(x){return used.indexOf(x)<0})[0]||'•';
  [selMatch,it].forEach(function(x){ var pp=x.querySelector('.pp'); pp.textContent=L; pp.classList.add('on'); x.dataset.pp=L; x.classList.remove('sel'); });
  selMatch=null;
}
function guessTF(it){ if(it.classList.contains('in'))return; var b=it.querySelector('.bd'); var g=b.getAttribute('data-g'); b.setAttribute('data-g', g==='✓'?'✗':(g==='✗'?'':'✓')); if(!b.getAttribute('data-g')) b.removeAttribute('data-g'); }
function guessBuild(tile){
  var b=tile.closest('.build'); if(tile.classList.contains('used'))return;
  var slot=[].filter.call(b.querySelectorAll('.slot'),function(x){return !x.classList.contains('in')&&!x.dataset.g})[0]; if(!slot)return;
  slot.dataset.g=tile.dataset.t; slot.querySelector('.g').textContent=tile.dataset.t; tile.classList.add('used');
}
/* سحبُ عناصرِ الترتيب */
$('wrap').addEventListener('pointerdown',function(e){
  var o=e.target.closest('.order .o'); if(!o)return;
  var list=o.parentNode, startY=e.clientY, moved=false; o.setPointerCapture(e.pointerId); o.classList.add('drag');
  function mv(ev){ if(Math.abs(ev.clientY-startY)>6) moved=true; if(!moved)return; dragging=true;
    var sib=[].filter.call(list.children,function(x){return x!==o}); var target=null;
    sib.forEach(function(x){var r=x.getBoundingClientRect(); if(ev.clientY>r.top&&ev.clientY<r.bottom) target=x;});
    if(target){ var r=target.getBoundingClientRect(); if(ev.clientY<r.top+r.height/2) list.insertBefore(o,target); else list.insertBefore(o,target.nextSibling); } }
  function up(){ o.classList.remove('drag'); o.removeEventListener('pointermove',mv); o.removeEventListener('pointerup',up); o.removeEventListener('pointercancel',up); paint(); setTimeout(function(){dragging=false},50); }
  o.addEventListener('pointermove',mv); o.addEventListener('pointerup',up); o.addEventListener('pointercancel',up);
});
/* الاختيارُ العشوائيُّ — من قائمةِ الفصلِ إن وُجدت، وإلا أرقامٌ ١..N */
var RN=parseInt(new URLSearchParams(location.search).get('n'),10)||30;
var WSX=(window.FB&&FB.ws)?FB.ws():'';
var RS={classes:null,cls:null,absent:{},asked:[],mode:'pick',last:null};
function todayISO(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function askedKey(){return 'sc_deck_asked_'+(RS.cls?RS.cls._id:'')+'_'+todayISO()}
function loadClasses(){
  if(RS.classes) return Promise.resolve(RS.classes);
  if(!(window.FB&&FB.DB&&(FB.teacher()||FB.demo))) return Promise.resolve(RS.classes=[]);
  return FB.DB.list('sc_classes'+WSX).then(function(l){ RS.classes=(l||[]).filter(function(c){return !c.archived}).sort(function(a,b){return (a.order||0)-(b.order||0)}); return RS.classes; }).catch(function(){return RS.classes=[]});
}
function chooseClass(id){
  RS.cls=(RS.classes||[]).filter(function(c){return c._id===id})[0]||null; RS.absent={}; RS.last=null;
  try{localStorage.setItem('sc_deck_cls',id||'')}catch(e){}
  try{RS.asked=JSON.parse(localStorage.getItem(askedKey())||'[]')}catch(e){RS.asked=[]}
  paintPill();
  if(!RS.cls) return Promise.resolve();
  return FB.DB.get('sc_days'+WSX, id+'_'+todayISO()).then(function(d){ ((d&&d.ev)||[]).forEach(function(e){ if(e.type==='absent') RS.absent[e.sid]=1; }); }).catch(function(){});
}
function paintPill(){ $('clsPill').textContent=RS.cls?RS.cls.name:''; }
function pool(){ return (RS.cls?RS.cls.students||[]:[]).filter(function(st){return !RS.absent[st.id]&&RS.asked.indexOf(st.id)<0}); }
function rndOpen(mode){ RS.mode=mode||'pick'; $('rnd').classList.add('on'); rndPaint(); }
function rndClose(){ $('rnd').classList.remove('on'); }
function rndPaint(){
  var b=$('rndBox'), h='';
  if(RS.mode==='cls'){
    h+='<div class="ttl">أيُّ فصلٍ في هذه الحصّة؟</div><div class="cls">'
      +(RS.classes||[]).map(function(c){return '<button data-c="'+c._id+'" class="'+(RS.cls&&RS.cls._id===c._id?'on':'')+'">'+esc(c.name)+' <small>('+ar((c.students||[]).length)+')</small></button>'}).join('')
      +'<button data-c="">بلا قائمة — أرقامٌ ١–'+ar(RN)+'</button></div>'
      +'<div class="st">يُستبعَدُ الغائبُ اليومَ ومن أجابَ من قبل، حتى يدورَ الدورُ على الجميع</div>';
  } else {
    var st=RS.last;
    h+=(RS.cls?'<div class="pkcls">'+esc(RS.cls.name)+'</div>':'')
      +'<div class="ring"><span class="av" id="rndAv">'+(st?esc(String(st.name).trim().charAt(0)):'؟')+'</span></div>'
      +'<div class="nm" id="rndN">'+(st?esc(st.name):'؟')+'</div><div class="rule"></div>'
      +'<div class="no">'+(st&&st.no?'رقمُ الجلوس '+ar(st.no):'')+'</div>'
      +'<div class="acts"><button class="p" id="rAgain">طالبٌ آخر</button>'
      +(RS.cls&&st?'<button id="rAbs">غائب — استبعِدْه اليوم</button>':'')
      +(RS.cls?'<button id="rReset">إعادةُ الدورِ للجميع</button>':'')
      +'<button id="rCls">'+(RS.cls?'تغييرُ الفصل':'اختيارُ الفصل')+'</button><button id="rClose">إغلاق</button></div>'
      +(RS.cls?'<div class="st">'+esc(RS.cls.name)+' · أجابَ <b>'+ar(RS.asked.length)+'</b> · غائبون <b>'+ar(Object.keys(RS.absent).length)+'</b> · بقيَ <b>'+ar(pool().length)+'</b></div>':'<div class="st">بلا قائمةِ فصل — اختَرْ فصلاً ليستبعدَ الغائبَ ومن أجاب</div>');
  }
  b.innerHTML=h;
}
$('rndBox').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return; e.stopPropagation();
  if(b.dataset.c!==undefined){ chooseClass(b.dataset.c).then(function(){ RS.mode='pick'; rndPick(); }); return; }
  if(b.id==='rAgain') rndPick();
  else if(b.id==='rAbs'&&RS.last){ RS.absent[RS.last.id]=1; RS.asked=RS.asked.filter(function(x){return x!==RS.last.id}); saveAsked(); rndPick(); }
  else if(b.id==='rReset'){ RS.asked=[]; saveAsked(); rndPaint(); }
  else if(b.id==='rCls'){ loadClasses().then(function(){ RS.mode='cls'; rndPaint(); }); }
  else if(b.id==='rClose') rndClose();
});
function saveAsked(){ try{localStorage.setItem(askedKey(),JSON.stringify(RS.asked))}catch(e){} }
function rndPick(){
  RS.mode='pick'; $('rnd').classList.add('on');
  if(!RS.cls){ /* أرقام */
    RS.last=null; rndPaint(); var n=$('rndN'), k=0, target=1+Math.floor(Math.random()*RN); n.classList.add('spin');
    $('rnd').classList.add('rolling'); $('rndBox').classList.remove('land');
    (function tick(){ n.textContent=ar(1+Math.floor(Math.random()*RN)); k++; if(k<14) setTimeout(tick,40+k*k*1.4);
      else { n.classList.remove('spin'); $('rnd').classList.remove('rolling'); n.textContent=ar(target); $('rndBox').classList.add('land'); } })();
    return;
  }
  var P=pool();
  if(!P.length){ if(!(RS.cls.students||[]).length){ RS.last=null; rndPaint(); $('rndN').textContent='لا متعلّمينَ في هذا الفصل'; return; }
    RS.asked=[]; saveAsked(); P=pool(); if(!P.length){ RS.last=null; rndPaint(); $('rndN').textContent='الكلُّ غائب!'; return; } }
  var target=P[Math.floor(Math.random()*P.length)];
  RS.last=target; RS.asked.push(target.id); saveAsked(); rndPaint();
  var n=$('rndN'), av=$('rndAv'), box=$('rndBox'), k=0, all=(RS.cls.students||[]).filter(function(st){return !RS.absent[st.id]});
  n.classList.add('spin'); $('rnd').classList.add('rolling'); box.classList.remove('land');
  (function tick(){ var r=all[Math.floor(Math.random()*all.length)]; n.textContent=r.name; av.textContent=String(r.name).trim().charAt(0);
    k++; if(k<14) setTimeout(tick,40+k*k*1.4);
    else { n.classList.remove('spin'); $('rnd').classList.remove('rolling'); n.textContent=target.name; av.textContent=String(target.name).trim().charAt(0); box.classList.add('land'); } })();
}
function rndStart(){
  if(RS.cls) { rndPick(); return; }
  loadClasses().then(function(cl){
    var saved=''; try{saved=localStorage.getItem('sc_deck_cls')||''}catch(e){}
    var hit=cl.filter(function(c){return c._id===saved})[0];
    if(hit) chooseClass(hit._id).then(rndPick);
    else if(cl.length){ RS.mode='cls'; $('rnd').classList.add('on'); rndPaint(); }
    else rndPick();
  });
}
$('rnd').addEventListener('click',function(e){ if(e.target===$('rnd')) rndClose(); });
$('bRnd').onclick=rndStart;
$('clsPill').onclick=function(){ loadClasses().then(function(){ RS.mode='cls'; $('rnd').classList.add('on'); rndPaint(); }); };
/* فصلٌ محفوظٌ من حصّةٍ سابقة يظهرُ في الشريطِ فوراً */
setTimeout(function(){ var saved=''; try{saved=localStorage.getItem('sc_deck_cls')||''}catch(e){} if(saved) loadClasses().then(function(cl){ if(cl.filter(function(c){return c._id===saved}).length) chooseClass(saved); }); },800);
/* لوحةُ النقاط */
var SC=[0,0]; try{ SC=JSON.parse(localStorage.getItem('sc_deck_score_'+ID)||'[0,0]'); }catch(e){}
function scPaint(){ $('score').querySelectorAll('.v').forEach(function(v){v.textContent=ar(SC[+v.dataset.t])}); try{localStorage.setItem('sc_deck_score_'+ID,JSON.stringify(SC))}catch(e){} }
$('score').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b)return; SC[+b.dataset.t]=Math.max(0,SC[+b.dataset.t]+ +b.dataset.d); scPaint(); });
$('bScore').onclick=function(){$('score').classList.toggle('on')};
scPaint();

/* ===== مؤقّتُ الدقيقةِ الواحدة ===== */
var T={on:false,left:60,total:60,iv:null};
var CIRC=2*Math.PI*44;
function tPaint(){ $('tnum').textContent=ar(T.left); $('tfg').style.strokeDasharray=CIRC; $('tfg').style.strokeDashoffset=CIRC*(1-T.left/T.total); }
function tStart(sec){
  clearInterval(T.iv); T.total=sec||60; T.left=T.total; T.on=true; $('timer').classList.add('on'); $('timer').classList.remove('end'); tPaint();
  T.iv=setInterval(function(){ T.left--; if(T.left<=0){T.left=0;clearInterval(T.iv);$('timer').classList.add('end');} tPaint(); },1000);
}
function tStop(){ clearInterval(T.iv); T.on=false; $('timer').classList.remove('on','end'); }
function tToggle(){ if(T.on) tStop(); else tStart((S[i]&&S[i].timer)||60); }
$('bTimer').onclick=tToggle;
$('timer').onclick=tToggle;

/* ===== ملاحظةُ المعلّم ===== */
var tipOn=false;
function tipPaint(){ var t=S[i]&&S[i].tip; $('tip').innerHTML=t?'<b>للمعلّم</b>'+nl(t):''; $('tip').classList.toggle('on',tipOn&&!!t); $('bTip').style.color=(S[i]&&S[i].tip)?'var(--gold)':''; }
$('bTip').onclick=function(){tipOn=!tipOn;tipPaint()};

document.addEventListener('keydown',function(e){
  if(e.target&&e.target.isContentEditable){ if(e.key==='Escape') e.target.blur(); return; }
  if(e.key==='Escape'){ if($('rnd').classList.contains('on')){rndClose();return;} $('map').hidden=!$('map').hidden; e.preventDefault(); return; }
  if(/^[1-9]$/.test(e.key)||/^[١-٩]$/.test(e.key)){ var k='١٢٣٤٥٦٧٨٩'.indexOf(e.key); if(k<0)k=+e.key-1; var os=slides()[i].querySelectorAll('.opts .o'); if(os[k]){vote(os[k]);e.preventDefault();return;} }
  if(e.key==='w'||e.key==='W'){ var b=slides()[i].querySelector('.bub:not(.in):not(.has)'); if(b){b.classList.add('has');var y=b.querySelector('.you');y.focus();} return; }
  if(e.key==='r'||e.key==='R'){rndStart();return}
  if(e.key==='s'||e.key==='S'){$('score').classList.toggle('on');return}
  if($('map').hidden===false && e.key!=='Escape') return;
  if(e.key===' '||e.key==='ArrowLeft'||e.key==='PageDown'||e.key==='Enter'){e.preventDefault();next()}
  else if(e.key==='ArrowRight'||e.key==='PageUp'||e.key==='Backspace'){e.preventDefault();prev()}
  else if(e.key==='ArrowDown'){e.preventDefault();go(i+1)}
  else if(e.key==='ArrowUp'){e.preventDefault();go(i-1)}
  else if(e.key==='Home'){e.preventDefault();go(0)}
  else if(e.key==='End'){e.preventDefault();go(S.length-1)}
  else if(e.key==='f'||e.key==='F'){full()}
  else if(e.key==='t'||e.key==='T'){tToggle()}
  else if(e.key==='n'||e.key==='N'){tipOn=!tipOn;tipPaint()}
});
function full(){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); }
$('bNext').onclick=next; $('bPrev').onclick=prev; $('bFull').onclick=full;
$('bMap').onclick=function(){$('map').hidden=!$('map').hidden};
$('bBack').onclick=function(){location.href='lesson.html?id='+encodeURIComponent(ID)};
$('wrap').addEventListener('click',function(e){
  if(e.target.closest('button')||dragging)return;
  var t=e.target, x;
  if((x=t.closest('[data-flip]'))){ x.classList.toggle('in'); return; }                       /* بطاقةٌ تنقلبُ بالنقر */
  if((x=t.closest('[data-hw]'))&&!x.classList.contains('in')){ x.classList.toggle('pick'); return; }
  if((x=t.closest('.opts .o'))){ vote(x); return; }                                             /* تصويت */
  if((x=t.closest('.tf .it'))){ guessTF(x); return; }                                           /* تخمينُ صحّ/خطأ */
  if((x=t.closest('.match .it'))){ propose(x); return; }                                        /* اقتراحُ توصيل */
  if((x=t.closest('.build .tile'))){ guessBuild(x); return; }                                   /* بناءٌ بالنقر */
  if(t.closest('.bub .you')||t.closest('.score')||t.closest('[contenteditable]')) return;        /* كتابةٌ في الفقاعة */
  if(t.closest('.order .o')) return;                                                            /* السحبُ لا يتقدّم */
  next();
});
var tx=0,ty=0;
$('wrap').addEventListener('touchstart',function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$('wrap').addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){ dx<0?next():prev(); }
},{passive:true});
setTimeout(function(){$('hintbar').classList.add('off')},6000);

/* ============ الإقلاع ============ */
(window.FB&&FB.Auth?FB.Auth.restore().catch(function(){}):Promise.resolve()).then(function(){
  if(window.FB&&FB.profile) ME=FB.profile();
  if(!(window.FB&&FB.teacher&&(FB.teacher()||FB.demo))){
    $('wrap').innerHTML='<section class="slide on"><div class="cover"><img class="mark" src="/img/logo-cream.svg" alt=""><div class="over">هذا العرضُ لمعلّمَي مدرستي</div>'
      +'<h1>ادخلْ بحسابِك أوّلاً</h1><div class="rule"></div><div class="meta"><a href="index.html#/" style="color:var(--gold)">الدخولُ إلى مدرستي</a></div></div></section>';
    $('count').textContent='—'; throw {gated:true};
  }
  return fetch('data/decks/'+ID+'.json',{cache:'no-cache'});
}).then(function(r){
  if(!r.ok) throw 0; return r.json();
}).then(function(j){
  D=j; S=j.slides||[];
  $('tTitle').textContent=fill(j.title||'التحضير');
  $('tSub').textContent=fill(j.sub||'');
  $('tKick').textContent=fill(j.kick||'');
  document.title=fill(j.title||'العرض')+' — عرضٌ تقديمي';
  build();
  var h=parseInt(location.hash.replace('#',''),10);
  show(h>0&&h<=S.length?h-1:0);
}).catch(function(e){
  if(e&&e.gated) return;
  $('wrap').innerHTML='<section class="slide on"><div class="cover"><div class="over">لا عرضَ لهذا التحضيرِ بعد</div>'
    +'<h1>العرضُ التقديمي</h1><div class="rule"></div>'
    +'<div class="meta"><a href="lesson.html?id='+encodeURIComponent(ID)+'" style="color:var(--gold)">العودةُ إلى التحضير</a></div></div></section>';
  $('count').textContent='—';
});
})();
